name: Step 4

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  actions: write
  issues: write

env:
  REVIEW_FILE: ".github/steps/x-review.md"

jobs:
  find_exercise:
    if: github.event.pull_request.merged == true
    name: Find Exercise Issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3

  check_step_work:
    name: Check step work
    runs-on: ubuntu-latest
    needs: [find_exercise]
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get response templates
        uses: actions/checkout@v4
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Find last comment
        id: find-last-comment
        uses: peter-evans/find-comment@v3
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          direction: last

      - name: Update comment - checking work
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: exercise-toolkit/markdown-templates/step-feedback/checking-work.md
          edit-mode: replace

      - name: Check if repository ruleset exists
        id: check-ruleset
        continue-on-error: true
        run: |
          set -euo pipefail

          classify_error() {
            local stderr_file="$1"
            local stderr_content
            stderr_content="$(cat "$stderr_file")"
            if echo "$stderr_content" | grep -Eq 'HTTP 401|401 Unauthorized'; then
              echo "::error::Falha de autenticação ao consultar rulesets. Revise o token do workflow (GITHUB_TOKEN/GH_TOKEN)."
            elif echo "$stderr_content" | grep -Eq 'HTTP 403|403 Forbidden'; then
              echo "::error::Permissão insuficiente para consultar rulesets. Revise as permissões administrativas e o escopo do token do workflow."
            else
              echo "::error::Falha ao consultar a API de rulesets. Verifique conectividade e permissões do workflow."
            fi
            echo "$stderr_content"
          }

          echo "ruleset_exists=false" >> "$GITHUB_OUTPUT"

          rulesets_response="$(mktemp)"
          rulesets_stderr="$(mktemp)"

          if ! gh api "repos/${{ github.repository }}/rulesets?per_page=100" >"$rulesets_response" 2>"$rulesets_stderr"; then
            classify_error "$rulesets_stderr"
            exit 1
          fi

          if ! jq -e 'type == "array"' "$rulesets_response" >/dev/null; then
            echo "::error::Resposta inválida da API ao listar rulesets. Esperado JSON em formato de lista."
            cat "$rulesets_response"
            exit 1
          fi

          ruleset_ids=$(jq -r '.[] | select((.enforcement // "") == "active") | .id' "$rulesets_response")

          if [ -z "$ruleset_ids" ]; then
            echo "::error::Nenhum ruleset ativo encontrado no repositório. Ative um ruleset com solicitação automática de revisão do Copilot."
            exit 1
          fi

          for ruleset_id in $ruleset_ids; do
            ruleset_detail_response="$(mktemp)"
            ruleset_detail_stderr="$(mktemp)"

            if ! gh api "repos/${{ github.repository }}/rulesets/$ruleset_id" >"$ruleset_detail_response" 2>"$ruleset_detail_stderr"; then
              classify_error "$ruleset_detail_stderr"
              exit 1
            fi

            if ! jq -e 'type == "object"' "$ruleset_detail_response" >/dev/null; then
              echo "::error::Resposta inválida da API ao consultar o ruleset $ruleset_id."
              cat "$ruleset_detail_response"
              exit 1
            fi

            if jq -e 'any((.rules // [])[]?; ((.type // "") | ascii_downcase) == "copilot_code_review")' "$ruleset_detail_response" >/dev/null; then
              echo "ruleset_exists=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "::error::Nenhum ruleset ativo contém a regra de solicitação automática de revisão do Copilot."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update comment - step results
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: exercise-toolkit/markdown-templates/step-feedback/step-results-table.md
          vars: |
            step_number: 4
            results_table:
              - description: "Repository ruleset ativo com solicitação automática de revisão do Copilot"
                passed: ${{ steps.check-ruleset.outcome == 'success' }}

      - name: Fail job if not all checks passed
        if: contains(steps.*.outcome, 'failure')
        run: exit 1

  post_review_content:
    name: Post review content
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get response templates
        uses: actions/checkout@v4
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Create comment - step finished - final review next
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/lesson-review.md

      - name: Create comment - add review content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.REVIEW_FILE }}

      - name: Disable current workflow
        run: gh workflow disable "${{github.workflow}}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finish_exercise:
    name: Finish Exercise
    needs: [find_exercise, post_review_content]
    uses: skills/exercise-toolkit/.github/workflows/finish-exercise.yml@v0.9.3
    with:
      issue-url: ${{ needs.find_exercise.outputs.issue-url }}
      exercise-title: "GitHub Copilot Code Review"
      update-readme-with-congratulations: false
